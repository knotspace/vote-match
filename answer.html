<script>
const questions=[{"theme":"解散の是非","q":"今回の衆議院解散・総選挙について、最も近い考えは？","a":["解散は妥当だった","解散には疑問がある","どちらともいえない"]},{"theme":"経済","q":"物価高への対策として、最も優先すべきものは？","a":["消費税などの減税","給付金など家計への直接支援","賃上げ・投資の促進","財政健全化"]},{"theme":"経済","q":"消費税のあり方について、近い考えは？","a":["税率を引き下げる・廃止する","食料品など一部を軽減する","現行水準を維持する","社会保障財源として引き上げも検討する"]},{"theme":"経済","q":"最低賃金や賃上げを進める方法として、重視するものは？","a":["政府が目標を定めて引き上げを促す","中小企業への支援を拡充する","規制より企業の成長・生産性向上を重視する","地域や業種の実情に応じて進める"]},{"theme":"外交・安全保障","q":"日本の防衛力について、今後どうするべきだと思いますか？","a":["さらに強化する","必要な範囲で段階的に強化する","現状を基本的に維持する","防衛費を抑え外交を重視する"]},{"theme":"外交・安全保障","q":"防衛費の財源について、近い考えは？","a":["増税も含め安定財源を確保する","歳出の見直しで財源を捻出する","国債の活用も検討する","防衛費の増額自体を見直す"]},{"theme":"外交・安全保障","q":"日米安全保障体制について、どう考えますか？","a":["日米同盟をさらに強化する","同盟を維持しつつ日本の自主性も高める","近隣諸国との対話・協力を優先する","安全保障政策全体を見直す"]},{"theme":"外交・安全保障","q":"武器輸出のルールについて、近い考えは？","a":["輸出できる範囲を広げる","一定の条件のもとで認める","原則として制限を維持する","さらに厳しく制限する"]},{"theme":"外交・安全保障","q":"外国人政策で、政府が重視すべきことは？","a":["受け入れ拡大と共生支援","人手不足分野など必要な範囲で受け入れる","受け入れの条件・管理を厳格化する","受け入れ規模を縮小する"]},{"theme":"政治改革","q":"企業・団体献金について、近い考えは？","a":["禁止する","上限や公開ルールを厳格化して維持する","現行制度を基本的に維持する","政治活動の自由を優先し規制を増やさない"]},{"theme":"政治改革","q":"政治資金の透明性を高めるため、最も必要なことは？","a":["第三者機関による監視を強化する","収支報告の公開を迅速・詳細にする","罰則を強化する","現行制度の運用改善を優先する"]},{"theme":"暮らし","q":"社会保障の給付と負担について、近い考えは？","a":["給付水準を維持・拡充する","給付内容を見直し負担増を抑える","現役世代の負担軽減を優先する","制度全体を抜本的に見直す"]},{"theme":"暮らし","q":"年金制度について、最も重視することは？","a":["給付水準の維持","保険料負担の抑制","最低保障の強化","働き方に応じた制度の柔軟化"]},{"theme":"暮らし","q":"医療・介護の提供体制について、近い考えは？","a":["公的サービスを拡充する","地域の実情に合わせて効率化する","民間サービスの活用を広げる","利用者負担を含め制度を見直す"]},{"theme":"暮らし","q":"子育て世帯への支援で、優先すべきものは？","a":["児童手当など経済的支援","保育・学童など受け皿の整備","育休・柔軟な働き方の推進","教育費の負担軽減"]},{"theme":"暮らし","q":"高校・大学などの教育費負担について、どう考えますか？","a":["所得制限なしで無償化を広げる","所得に応じて支援を拡充する","必要性の高い家庭・分野に重点化する","公的支援より教育の質を重視する"]},{"theme":"暮らし","q":"地方と都市の格差を縮めるため、重視する政策は？","a":["地方への財源移転を増やす","地方の産業・雇用を育てる","交通・医療・教育など生活基盤を整える","規制緩和や民間投資を促す"]},{"theme":"暮らし","q":"原子力発電の今後について、近い考えは？","a":["安全性を確認した原発を活用する","新増設も含めて活用する","依存度を段階的に下げる","早期に廃止する"]},{"theme":"暮らし","q":"選択的夫婦別姓制度について、近い考えは？","a":["導入するべき","旧姓の通称使用を拡大するべき","現行制度を維持するべき","さらに議論が必要"]},{"theme":"憲法・皇室","q":"憲法改正について、近い考えは？","a":["必要な項目を具体的に改正する","議論を進め内容を見極めて判断する","現行憲法を維持する","改正より現行憲法の運用を重視する"]},{"theme":"憲法・皇室","q":"憲法9条について、どう考えますか？","a":["自衛隊の位置づけを明記する","自衛隊の活動範囲を含め改正を検討する","現行の条文を維持する","安全保障政策と合わせて慎重に議論する"]},{"theme":"憲法・皇室","q":"皇位継承のあり方について、近い考えは？","a":["女性天皇・女系天皇を認める方向で検討する","女性天皇は認めるが女系天皇は慎重に考える","男系による継承を維持する","幅広い議論を続ける"]}];const explanations=["衆議院解散は、衆議院議員全員の任期が終わる前に議員の資格をいったん失わせ、総選挙を行う仕組みです。解散すると、国民が新しい議員を選び直します。内閣総理大臣は、政治の方針について国民に判断を求めるために解散することがあります。一方、選挙に多額の費用がかかることや、国会での議論を中断することから、解散の理由や時期が適切だったかが論点になります。「妥当」は選挙で信を問う必要があったという考え、「疑問」は解散の必要性やタイミングに問題があったという考えです。","物価高とは、食料品・電気代・ガソリンなど、普段買うものの値段が全体的に上がることです。減税は税金を軽くして買い物などに使えるお金を増やす方法、給付は政府が現金などを直接配る方法です。賃上げ・投資は、会社の給料や生産力を高めて収入を増やす考え方です。財政健全化は、国の借金や赤字が大きくなりすぎないようにすることです。どれを優先するかで、効果が出る速さや国の支出、将来の負担が変わります。","消費税は、商品やサービスを買うときに代金に上乗せして払う税金です。税率を下げたり廃止したりすれば、買い物の負担は軽くなりますが、国や自治体に入る税収も減ります。食料品だけ税率を下げる案は、生活必需品の負担を重点的に軽くする方法です。現状維持は、社会保障などの財源を安定させることを重視します。引き上げを検討する考えは、医療・年金・介護などに必要なお金を確保することを重視します。減税する場合、減った税収を何で補うかも大切な論点です。","最低賃金は、会社が働く人に支払わなければならない時給の最低ラインです。政府が引き上げ目標を示す方法は、全国的に賃金を上げる力になりますが、人件費が増える企業への影響も考える必要があります。中小企業支援は、補助金や取引環境の改善などで企業が賃上げできるようにする考え方です。生産性向上は、同じ時間でより多くの価値を生み出せるよう、設備や技術を改善することです。地域や業種ごとの実情を重視する案は、地方や小さな企業への急な負担を避けることを重視します。","防衛力とは、外国から攻撃された場合などに日本を守るための自衛隊の装備・人員・体制のことです。強化する考えは、ミサイル防衛や装備、人員などを増やして抑止力を高めようとします。段階的な強化は、必要性を確認しながら少しずつ整える考えです。現状維持は、今ある体制を基本にする立場です。防衛費を抑えて外交を重視する考えは、軍事力だけでなく話し合いや国際協力で衝突を防ぐことを重視します。防衛力をどうするかは、周辺国の動き、費用、緊張を高める可能性などを合わせて考える必要があります。","防衛費は、自衛隊の人件費、装備の購入・修理、基地の維持などに使われる国のお金です。財源とは、その支出に使うお金をどこから集めるかということです。増税は税金を増やして安定的に確保する方法、歳出見直しは他の予算を減らして回す方法、国債は国が借金をして資金を調達する方法です。国債は将来の返済や利払いが必要になるため、将来世代の負担につながる可能性があります。そもそも防衛費を増やす必要があるのかを見直す立場もあります。","日米安全保障体制（日米同盟）は、日本とアメリカが協力して日本や地域の安全を守る枠組みです。日本国内の米軍基地や、攻撃を受けた場合の協力などが関係します。同盟強化は、アメリカとの共同訓練や防衛協力を深める考えです。自主性も高める案は、同盟を続けながら日本自身の判断力や防衛力も高めようとします。近隣諸国との対話を優先する案は、外交や経済交流を通じて緊張を下げることを重視します。安全保障政策全体の見直しは、同盟や基地のあり方も含めて考え直す立場です。","武器輸出は、日本で作った防衛装備品を外国に売ったり提供したりすることです。輸出範囲を広げると、防衛産業を支えたり、友好国の防衛に協力したりできる一方、紛争に使われる危険や国際的な緊張への懸念があります。条件付きで認める案は、相手国や用途、管理方法などに制限を設けます。原則制限・さらに厳格化は、武器が戦争や人権侵害に使われることを防ぐ考えを重視します。どの国に何をどこまで輸出するか、チェックする仕組みも重要です。","外国人政策は、日本で暮らしたり働いたりする外国籍の人を、どのように受け入れ、支援し、ルールを守ってもらうかという政策です。受け入れ拡大と共生支援は、人手不足への対応や多文化共生、日本語教育などを重視します。必要な分野に限る案は、介護・建設など人手不足の仕事を中心に受け入れます。管理の厳格化は、在留資格やルール違反への対応を強める考えです。受け入れ縮小は、国内の雇用や社会制度への影響を抑えることを重視します。外国人全体を一括りにせず、働く人・留学生・難民など制度の違いも考える必要があります。","企業・団体献金は、会社や業界団体などが政党や政治家側にお金を寄付することです。禁止する案は、企業などの資金力が政治判断に影響することを防ごうとします。上限や公開を厳しくする案は、献金を認めつつ、金額や相手を見えるようにします。現行制度の維持は、政治活動に必要な資金を確保することを重視します。規制を増やさない考えは、政治活動や表現の自由を重視します。政治資金の透明性や、個人献金・政党交付金との関係も論点です。","政治資金は、政党や政治家が活動するために使うお金です。第三者機関による監視は、政治家本人とは別の組織がルール違反を調べる仕組みです。収支報告の公開を早く詳しくする案は、誰からいくら受け取り、何に使ったかを国民が確認しやすくします。罰則強化は、報告漏れや不正があった場合の責任を重くします。運用改善は、法律を大きく変えるより、現在の制度を正しく使うことを重視します。大切なのは、記録の正確さ、チェックする人の独立性、違反時の対応です。","社会保障は、病気・高齢・失業・子育てなど、生活が難しくなったときに社会全体で支える仕組みです。医療保険、年金、介護、生活保護、子育て支援などが含まれます。給付を維持・拡充する考えは、必要なサービスやお金を確保することを重視します。給付内容の見直しは、必要性の高い人に重点を置き、負担増を抑えようとします。現役世代の負担軽減は、働く世代が払う保険料や税金を軽くすることを重視します。制度全体の見直しは、給付と負担のバランスを根本から考え直す立場です。","年金は、年を取って働く収入が減ったときなどに、生活を支えるため定期的に受け取るお金です。日本の公的年金は、現役世代などが保険料を出し合い、高齢者などに給付する仕組みを基本にしています。給付水準の維持は、将来も受け取る額を確保することを重視します。保険料負担の抑制は、現役世代や企業が払う額を抑える考えです。最低保障の強化は、年金が少ない人の生活を支えることを重視します。働き方に応じた柔軟化は、短時間労働や自営業など多様な働き方に合わせた制度を考えます。","医療・介護の提供体制とは、病院・診療所・介護施設・訪問サービスなどを、誰がどこでどのように提供するかという仕組みです。公的サービスの拡充は、国や自治体が人材や施設を支えることを重視します。地域に合わせた効率化は、人口や患者数に応じて病院やサービスの配置を見直します。民間活用は、民間企業や団体のサービスを広げる考えです。利用者負担の見直しは、サービスを使う人が払う料金や保険料も検討します。医療や介護を受けやすくすることと、働く人材・財源を確保することの両立が課題です。","子育て支援には、子どもを育てる家庭へのお金の支援、保育所や学童の整備、親が働き続けやすい制度、教育費の軽減などがあります。児童手当などの経済支援は、家庭が使えるお金を直接増やします。保育・学童の整備は、預け先を確保して仕事と子育てを両立しやすくします。育休や柔軟な働き方は、親が仕事を休んだり時間を調整したりしやすくします。教育費の軽減は、授業料や教材費などの負担を下げます。どの支援が必要かは、子どもの年齢や家庭の状況によっても異なります。","教育費には、授業料だけでなく、入学金・教材・制服・通学費・塾なども含まれます。無償化を広げる案は、家庭の所得にかかわらず教育を受けやすくしますが、国や自治体の費用が大きくなります。所得に応じた支援は、経済的に負担が重い家庭を重点的に助けます。必要性の高い家庭・分野への重点化は、困窮家庭や人材育成が必要な分野に資金を集中します。公的支援より質を重視する案は、授業内容や先生・設備など教育そのものの改善を重視します。誰が対象で、どこまで無料にするかが大切です。","地方と都市の格差には、仕事の数、賃金、交通、病院、学校、買い物の便利さなどの違いがあります。地方への財源移転は、国のお金を地方自治体に配分して公共サービスを支えます。産業・雇用を育てる案は、地元企業や新しい仕事を増やして地域経済を強くします。生活基盤の整備は、交通・医療・教育など暮らしに必要なサービスを維持します。規制緩和や民間投資は、事業を始めやすくし、民間のお金や技術を地域に呼び込む考えです。地域ごとに人口や産業が違うため、何を優先するかが論点になります。","原子力発電（原発）は、ウランなどの核分裂で熱を生み、その熱で電気を作る発電方法です。発電時に二酸化炭素を比較的多く出さない一方、重大事故、放射性廃棄物、廃炉などの課題があります。安全性を確認した原発の活用は、既存施設を一定の条件で使う考えです。新増設も含める案は、将来の電力供給に原発を活用する範囲を広げます。依存度を下げる案は、再生可能エネルギーなどに徐々に切り替えます。早期廃止は、原発を使わない電力体制を目指します。電気の安定供給、料金、気候変動、安全性を合わせて考える必要があります。","選択的夫婦別姓は、結婚した夫婦が、希望すれば結婚前の名字をそれぞれ使い続けられる制度です。現在の日本では、結婚すると夫婦は同じ名字を名乗る必要があります。導入賛成の立場は、仕事上の名前や自分らしさを保ちやすくすることを重視します。旧姓の通称使用拡大は、法律上の名字は同じにしたまま、職場や手続きで旧姓を使いやすくする案です。現行制度維持は、家族が同じ名字を持つことや制度の安定を重視します。戸籍・子どもの名字・行政手続きなど、制度設計の具体論もあります。","憲法改正は、日本の国の基本ルールである憲法の文章を正式な手続きで変更することです。憲法には、国会・内閣・裁判所の仕組み、国民の権利、平和主義などが定められています。改正を進める立場は、社会や安全保障の変化に合わせて条文を更新する必要があると考えます。慎重に判断する立場は、改正の必要性や内容を一つずつ確認します。維持する立場は、今の憲法が持つ原則や権利保障を守ることを重視します。改正には国会の発議と国民投票が必要で、簡単には変えられない仕組みです。","憲法9条は、戦争の放棄や戦力の不保持などを定めた条文です。日本政府は、自衛のための必要最小限度の実力として自衛隊を認める解釈を取っています。自衛隊を明記する案は、憲法に自衛隊の存在を書き込んで位置づけを明確にしようとします。活動範囲も含めて改正を検討する案は、自衛隊がどこまで何をできるかを条文で整理する考えです。現行条文の維持は、9条の現在の文言を変えないことを重視します。安全保障政策と合わせて議論する案は、条文だけでなく実際の防衛活動や歯止めも考えます。","皇位継承は、天皇の位を次の人に引き継ぐことです。現在の皇室典範では、皇位は男系の男子が継承すると定められています。女性天皇は、天皇の子どもなど女性が天皇になることです。女系天皇は、母方を通じて皇室につながる人が天皇になることを指し、女性天皇とは別の意味です。女性・女系を認める方向は、継承できる人を広げることを重視します。女性天皇のみ認める案は、男系を維持しつつ女性が即位する可能性を考えます。男系維持は、父方を通じた皇統の継続を重視します。"];const themes=[...new Set(questions.map(q=>q.theme))];let selectedThemes=[],active=[],idx=0,answers={},mode=new URLSearchParams(location.search).get("mode")||"party";
const $=id=>document.getElementById(id);const KEY="votemap2026";
function save(){localStorage.setItem(KEY,JSON.stringify({mode,district:$("district").value,selectedThemes,active,idx,answers,updated:Date.now()}))}
function section(id){["setup","quiz","listview"].forEach(x=>$(x).hidden=x!==id);window.scrollTo(0,0)}
themes.forEach((t,i)=>{$("themes").insertAdjacentHTML("beforeend",'<label class="theme"><input type="checkbox" value="'+t+'" checked><span><strong>'+t+'</strong><br><small class="muted">'+questions.filter(q=>q.theme===t).length+'問</small></span></label>')});
$("all").onclick=()=>document.querySelectorAll("#themes input").forEach(x=>x.checked=true);
function start(){selectedThemes=[...document.querySelectorAll("#themes input:checked")].map(x=>x.value);if(!selectedThemes.length){alert("テーマを1つ以上選択してください");return}active=questions.map((q,i)=>selectedThemes.includes(q.theme)?i:-1).filter(i=>i>=0);idx=0;answers={};save();section("quiz");render()}
function render(){const q=questions[active[idx]];$("count").textContent=(idx+1)+" / "+active.length+" 問";$("pct").textContent=Math.round((idx+1)/active.length*100)+"%";$("fill").style.width=((idx+1)/active.length*100)+"%";$("topic").textContent=q.theme;$("question").textContent=q.q;const helpWrap=document.createElement("section");helpWrap.className="help-wrap";const helpButton=document.createElement("button");helpButton.type="button";helpButton.className="help-toggle";helpButton.setAttribute("aria-expanded","false");const plus=document.createElement("span");plus.className="help-plus";plus.textContent="+";const helpLabel=document.createElement("span");helpLabel.textContent="詳しく！";helpButton.append(plus,helpLabel);const helpBody=document.createElement("div");helpBody.className="help-body";helpBody.hidden=true;const helpText=document.createElement("p");helpText.textContent=explanations[active[idx]]||"この質問に関係する制度や背景を確認しながら、自分に近い考えを選んでください。";helpBody.append(helpText);helpButton.onclick=()=>{const open=helpBody.hidden;helpBody.hidden=!open;helpButton.setAttribute("aria-expanded",String(open));plus.textContent=open?"−":"+";};helpWrap.append(helpButton,helpBody);const previousHelp=$("choices").previousElementSibling;if(previousHelp?.classList.contains("help-wrap"))previousHelp.remove();$("choices").before(helpWrap);$("choices").innerHTML="";q.a.concat(["どちらともいえない","回答しない"]).forEach((v,i)=>{const b=document.createElement("button");b.className="choice"+(answers[active[idx]]===i?" active":"");b.textContent=v;b.onclick=()=>{answers[active[idx]]=i;save();render()};$("choices").append(b)});$("prev").disabled=idx===0;$("next").textContent=idx===active.length-1?"結果を見る →":"次へ →";$("next").disabled=answers[active[idx]]===undefined}
$("go").onclick=start;$("settings").onclick=()=>section("setup");$("prev").onclick=()=>{if(idx>0){idx--;save();render()}};$("next").onclick=()=>{if(idx<active.length-1){idx++;save();render()}else{save();location.href="result.html"}};$("list").onclick=()=>{const host=$("questionlist");host.innerHTML="";active.forEach((n,j)=>{const q=questions[n],d=document.createElement("div");d.className="result-row";const a=answers[n]===undefined?"未回答":q.a.concat(["どちらともいえない","回答しない"])[answers[n]];d.innerHTML='<span class="topic">'+q.theme+'</span><p><strong>'+(j+1)+'. '+q.q+'</strong></p><p class="muted">'+a+'</p><button class="btn light" data-j="'+j+'">この質問を変更</button>';host.append(d)});host.querySelectorAll("button").forEach(b=>b.onclick=()=>{idx=Number(b.dataset.j);section("quiz");render()});section("listview")};$("resume").onclick=()=>{section("quiz");render()};
const saved=JSON.parse(localStorage.getItem(KEY)||"null");
if(new URLSearchParams(location.search).get("resume")==="1" && saved?.mode) mode=saved.mode;
if(mode==="party"){
  document.querySelector('label[for="district"]').hidden=true;
  $("district").hidden=true;
  $("setup").querySelector(".title").textContent="政党の政策と比べる";
  $("setup").querySelector(".lead").textContent="関心のあるテーマを選び、質問に回答してください。";
}else{
  $("setup").querySelector(".title").textContent="選挙区の候補者と比べる";
  $("setup").querySelector(".lead").textContent="選挙区を選び、関心のあるテーマの質問に回答してください。";
}
if(saved&&saved.active?.length){
  selectedThemes=saved.selectedThemes;active=saved.active;idx=Math.min(saved.idx||0,active.length-1);answers=saved.answers||{};
  if(saved.district) $("district").value=saved.district;
  if(new URLSearchParams(location.search).get("resume")==="1"){mode=saved.mode||mode;section("quiz");render()}
}
</script></body></html>
