<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>政治・選挙のしくみクイズ｜VOTE MATCH</title>
<style>:root{color-scheme:dark;--bg:#090b10;--panel:#141b27;--line:#293344;--ink:#f3f5f8;--muted:#9eabba;--accent:#a99aff;--cyan:#70ddd4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#292342,transparent 55%),var(--bg);color:var(--ink);font:15px/1.8 system-ui,"Noto Sans JP",sans-serif}.wrap{width:min(100% - 32px,760px);margin:auto}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center}.brand{color:var(--ink);text-decoration:none;font-weight:900}.brand small{font-size:10px;color:var(--muted);margin-left:8px}.hero{padding:42px 0 18px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.15em}h1{font-size:clamp(30px,5vw,44px);margin:10px 0}.lead,.muted{color:var(--muted)}.card{background:linear-gradient(145deg,#171f2d,#10151d);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,30px);margin:20px 0}.progress{height:5px;background:#293344;border-radius:10px;overflow:hidden;margin:12px 0 24px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#9b8cff,#70ddd4);width:0}.topic{color:var(--cyan);font-size:11px;font-weight:800}.question{font-size:22px;line-height:1.5;margin:10px 0 20px}.options{display:grid;gap:10px}.opt{background:#1b2330;border:1px solid #303b4c;border-radius:13px;color:var(--ink);padding:14px;text-align:left;cursor:pointer}.opt:hover{border-color:var(--accent)}.opt.good{border-color:#70ddd4;background:#15302e}.opt.bad{border-color:#ff9e89;background:#321f24}.explain{margin-top:15px;color:var(--muted);font-size:13px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}button{border:0;border-radius:12px;padding:12px 17px;background:#283044;color:white;font-weight:800;cursor:pointer}button.primary{background:linear-gradient(110deg,#8978ff,#5e9df7)}.hidden{display:none!important}.result{font-size:36px;font-weight:900;color:var(--accent)}footer{padding:25px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:45px}</style></head><body><header><div class="wrap"><a class="brand" href="./">VOTE MATCH <small>POLICY & IDEAS</small></a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">CIVICS QUIZ / LEARN BY PLAYING</div><h1>政治のしくみ、何問わかる？</h1><p class="lead">国会・選挙・憲法の基本をクイズでチェック。正解しても不正解でも、解説で知識を増やそう。</p></section><section class="card" id="game"><div class="muted" id="counter">QUESTION 1 / 8</div><div class="progress"><span id="fill"></span></div><div class="topic" id="topic"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="explain hidden" id="explain"></div><div class="actions"><button id="restart">最初から</button><button class="primary" id="next" disabled>次の問題 →</button></div></section><section class="card hidden" id="result"><div class="eyebrow">YOUR RESULT</div><div class="result" id="score"></div><p id="message" class="muted"></p><button class="primary" id="again">もう一度挑戦</button></section></main><footer><div class="wrap">VOTE MATCH · <a href="./" style="color:#bdb1ff">トップへ戻る</a></div></footer>
<script>
const qs=[
["国会","日本の国会は、何院制？",["一院制","二院制","三院制","四院制"],1,"衆議院と参議院からなる二院制です。両院で審議することで、異なる視点から法律や予算などを検討します。"],
["国会","法律案が衆議院で可決され、参議院で否決された場合、一定の条件で再可決できるのは？",["衆議院","参議院","内閣","最高裁判所"],0,"憲法の定める条件を満たせば、衆議院で出席議員の3分の2以上の賛成により再可決できます。"],
["選挙","衆議院議員の任期は原則何年？",["2年","3年","4年","6年"],2,"衆議院議員の任期は4年ですが、解散があるため任期満了前に総選挙が行われることがあります。"],
["選挙","参議院議員の任期は何年？",["3年","4年","5年","6年"],3,"任期は6年で、3年ごとに半数を改選します。参議院には解散がありません。"],
["憲法","日本国憲法の三大原則に含まれないものは？",["国民主権","基本的人権の尊重","平和主義","三権分立"],3,"三大原則は国民主権・基本的人権の尊重・平和主義です。三権分立は権力を分けて抑制する仕組みです。"],
["政治制度","内閣総理大臣を指名するのは？",["国民の直接投票","国会","最高裁判所","都道府県知事"],1,"国会議員の中から国会が指名します。国民は国会議員を選挙で選びます。"],
["政治制度","国の予算案を作成して国会に提出するのは？",["内閣","最高裁判所","都道府県議会","選挙管理委員会"],0,"内閣が予算を作成して国会に提出し、国会が審議・議決します。"],
["選挙","比例代表制の特徴として最も近いものは？",["候補者の年齢順に当選","政党などの得票に応じて議席を配分","必ず一選挙区一人だけ当選","投票せず抽選で決める"],1,"比例代表制は政党などの得票数に応じて議席を配分する仕組みです。衆参で細かな制度は異なります。"]
];let i=0,score=0,chosen=false;const $=x=>document.getElementById(x);function render(){let q=qs[i];chosen=false;$("counter").textContent="QUESTION "+(i+1)+" / "+qs.length;$("fill").style.width=(i/qs.length*100)+"%";$("topic").textContent=q[0];$("question").textContent=q[1];$("options").innerHTML="";$("explain").classList.add("hidden");q[2].forEach((v,n)=>{let b=document.createElement("button");b.className="opt";b.textContent=v;b.onclick=()=>{if(chosen)return;chosen=true;let ok=n===q[3];if(ok)score++;b.classList.add(ok?"good":"bad");[...$("options").children].forEach((x,k)=>{x.disabled=true;if(k===q[3])x.classList.add("good")});$("explain").textContent=(ok?"正解！ ":"正解は「"+q[2][q[3]]+"」。 ")+q[4];$("explain").classList.remove("hidden");$("next").disabled=false};$("options").append(b)});$("next").textContent=i===qs.length-1?"結果を見る →":"次の問題 →";$("next").disabled=true}function finish(){$("game").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=score+" / "+qs.length+" 問正解";$("message").textContent=score===qs.length?"全問正解！制度の基本をしっかり押さえています。":score>=5?"いい感じ！解説を読み返して知識を固めよう。":"ここから覚えていけば大丈夫。もう一度挑戦してみよう。"}function reset(){$("result").classList.add("hidden");$("game").classList.remove("hidden");i=0;score=0;render()}$("next").onclick=()=>{if(i<qs.length-1){i++;render()}else finish()};$("restart").onclick=reset;$("again").onclick=reset;render();
</script></body></html>
