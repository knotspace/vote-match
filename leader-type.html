<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>あなたが政治家なら？リーダータイプ診断｜VOTE MATCH</title><style>
:root{color-scheme:dark;--bg:#090b10;--line:#283243;--ink:#f3f5f8;--muted:#a1adbd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#292342,transparent 55%),var(--bg);color:var(--ink);font:15px/1.8 system-ui,"Noto Sans JP",sans-serif}.wrap{width:min(100% - 32px,740px);margin:auto}header{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center}.brand{color:var(--ink);font-weight:900;text-decoration:none}.back{margin-left:auto;color:var(--muted);text-decoration:none}.hero{padding:38px 0 20px}.eyebrow{color:#71ddd3;font-size:11px;font-weight:800;letter-spacing:.15em}.hero h1{font-size:clamp(29px,5vw,44px);line-height:1.3}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#171e2a,#10141c);padding:clamp(18px,4vw,28px);margin:20px 0 45px}.meta,.actions{display:flex;justify-content:space-between;gap:10px}.meta{font-size:12px;color:var(--muted)}.track{height:5px;background:#293242;margin:12px 0 25px}.track span{display:block;height:100%;background:linear-gradient(90deg,#9b8cff,#69d7d0)}.q{font-size:23px;line-height:1.5}.opts{display:grid;gap:10px}.opt,.btn{border:1px solid #354052;border-radius:12px;padding:14px;background:#1b2330;color:var(--ink);text-align:left;cursor:pointer}.opt.sel{border-color:#a99aff;background:#292642}.actions{margin-top:22px}.btn.primary{background:#7565d9;border:0}.btn:disabled{opacity:.35}.hidden{display:none}.result{font-size:30px;color:#c3b8ff;font-weight:900}.rank{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:12px}@media(max-width:560px){.wrap{width:calc(100% - 26px)}.actions .btn{flex:1}}
</style></head><body><header><div class="wrap" style="display:flex"><a class="brand" href="./">VOTE MATCH</a><a class="back" href="./">← トップへ</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">JUST FOR FUN / SELF CHECK</div><h1>あなたが政治家なら？リーダータイプ診断</h1><p>もし政治を動かす立場なら、どんなリーダーになる？判断のクセから4タイプに分類。</p><p class="tiny">全8問・約2分・登録不要。回答はこの端末内で処理します。</p></section><section class="card" id="quiz"><div class="meta"><span id="count"></span><span id="pct"></span></div><div class="track"><span id="fill"></span></div><div class="eyebrow">QUESTION</div><h2 class="q" id="question"></h2><div class="opts" id="opts"></div><div class="actions"><button class="btn" id="prev">← 戻る</button><button class="btn primary" id="next" disabled>次へ →</button></div></section><section class="card hidden" id="result"><div class="eyebrow">YOUR RESULT</div><div class="result" id="type"></div><p id="desc"></p><div id="ranks"></div><p class="tiny">※娯楽目的の簡易診断です。人の性格や考え方を完全に分類するものではありません。</p><div class="actions"><button class="btn" id="again">もう一度</button><button class="btn primary" id="share">結果をコピー</button></div></section></main><footer><div class="wrap">VOTE MATCH · POLICY & IDEAS</div></footer><script>
const qs=[["予算不足なら？",["制度改革で財源を作る","話し合いで優先順位を決める","理念に合う政策を守る","費用対効果で選ぶ"],[0,1,2,3]],["反対が強い改革は？",["期限を決めて実行","対話を増やす","必要性を訴え続ける","小さく試して検証"],[0,1,2,3]],["成果の判断基準は？",["変化の大きさ","納得している人の多さ","理念への近さ","数字で見た改善度"],[0,1,2,3]],["災害対応で最初に重視？",["指揮系統を一本化","自治体・住民との連携","弱い立場の人を守る","物資・人員の効率配分"],[0,1,2,3]],["チームの意見が割れたら？",["決断して進む","全員の話を聞く","譲れない原則を確認","条件を整理して判断"],[0,1,2,3]],["不人気でも必要な政策は？",["変革の必要性を訴える","説明と対話を続ける","信念を曲げず主張","段階的に実施する"],[0,1,2,3]],["新技術への対応は？",["早く導入する","専門家や市民の声を聞く","社会にとって望ましいか考える","安全性と費用を検証"],[0,1,2,3]],["理想の成果は？",["社会が大きく変わる","立場の違う人が協力","価値観が守られる","暮らしの不便が減る"],[0,1,2,3]]],types=["改革を進めるチャレンジャー","課題を見つけ、変化を起こすことに前向き。スピード感と実行力を大切にする。"];let n=0,ans=Array(8).fill(null);const $=x=>document.getElementById(x);
function show(r){$("quiz").classList.toggle("hidden",r);$("result").classList.toggle("hidden",!r);window.scrollTo({top:0,behavior:"smooth"})}
function draw(){let q=qs[n];$("count").textContent="QUESTION "+(n+1)+" / 8";$("pct").textContent=Math.round((n+1)/8*100)+"%";$("fill").style.width=((n+1)/8*100)+"%";$("question").textContent=q[0];$("opts").innerHTML="";q[1].forEach((v,i)=>{let b=document.createElement("button");b.className="opt"+(ans[n]===i?" sel":"");b.textContent=v;b.onclick=()=>{ans[n]=i;draw()};$("opts").append(b)});$("prev").disabled=n===0;$("next").disabled=ans[n]===null;$("next").textContent=n===7?"結果を見る →":"次へ →"}
function finish(){let s=[0,0,0,0];ans.forEach((v,i)=>s[qs[i][2][v]]++);let order=s.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);let t=types[order[0].i];$("type").textContent=t[0];$("desc").textContent=t[1];$("ranks").innerHTML="";order.forEach((x,i)=>{let d=document.createElement("div");d.className="rank";d.innerHTML="<span>"+(i+1)+"位　"+types[x.i][0]+"</span><strong>"+x.v+"/8</strong>";$("ranks").append(d)});show(true)}
$("prev").onclick=()=>{if(n){n--;draw()}};$("next").onclick=()=>{if(n<7){n++;draw()}else finish()};$("again").onclick=()=>{n=0;ans=Array(8).fill(null);show(false);draw()};$("share").onclick=()=>navigator.clipboard?.writeText(document.title+"\n"+$("type").textContent+"\n"+location.href).then(()=>$("share").textContent="コピーしました ✓");draw();
</script></body></html>
