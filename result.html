<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102e4b"><title>マッチング結果｜ボートマッチ</title><style>
:root{color-scheme:light;--bg:#fff;--paper:#fff;--ink:#20252b;--muted:#626b75;--line:#d7dce1;--blue:#0757a6;--blue2:#edf4fb;--nav:#fff}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.75;font-size:15px}
a{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
button,input,select{font:inherit}
.bar{background:#fff;color:var(--ink);padding:0;border-bottom:1px solid #cfd5db}
.bar .wrap{min-height:66px;display:flex;align-items:center}
.wrap{width:min(100% - 40px,960px);margin:auto}
.brand{font-size:21px;font-weight:800;letter-spacing:.01em;color:#20252b!important;text-decoration:none!important}
.brand small{font-size:12px;font-weight:500;color:#66717d;margin-left:12px;letter-spacing:0}
.main{padding:36px 0 72px}
.eyebrow{font-size:12px;color:#6a737d;font-weight:700;letter-spacing:.08em}
.title{font-size:clamp(26px,4vw,34px);line-height:1.45;margin:8px 0 12px;font-weight:750}
.lead{color:#515b66;margin:0 0 26px}
.card{background:#fff;border:1px solid #d4d9de;border-radius:3px;padding:clamp(18px,4vw,30px);box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #0757a6;border-radius:3px;padding:12px 22px;background:#0757a6;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}
.btn.light{background:#fff;color:#0757a6;border:1px solid #9baaba}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.progress{height:6px;border-radius:0;background:#e7eaed;overflow:hidden;margin:12px 0 24px}
.progress span{display:block;height:100%;background:#0757a6;width:0}
.qtitle{font-size:22px;line-height:1.6;margin:12px 0 22px;font-weight:700}
.choices{display:grid;gap:0;border-top:1px solid #d7dce1}
.choice{width:100%;text-align:left;border:0;border-bottom:1px solid #d7dce1;background:#fff;padding:16px 14px;cursor:pointer;color:var(--ink);border-radius:0}
.choice:before{content:"";display:inline-block;width:15px;height:15px;border:1px solid #8d98a3;border-radius:50%;vertical-align:-2px;margin-right:12px}
.choice.active{outline:2px solid #0757a6;outline-offset:-2px;background:#f0f6fc;padding:16px 14px}
.choice.active:before{border:5px solid #0757a6}
.muted{color:var(--muted);font-size:13px}
.foot{padding:24px 0;color:#626b75;font-size:12px;border-top:1px solid #d7dce1;background:#f7f8f9}
.topic{padding:3px 8px;border-radius:2px;background:#edf4fb;color:#0757a6;font-size:12px;font-weight:700;display:inline-block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.theme{display:flex;gap:10px;align-items:flex-start;border:0;border-top:1px solid #d7dce1;border-radius:0;padding:12px 4px;background:#fff}
.theme input{margin-top:6px;accent-color:#0757a6}
.field{width:100%;padding:12px;border:1px solid #aeb8c2;border-radius:2px;background:#fff;color:var(--ink)}
.divider{border:0;border-top:1px solid #d7dce1;margin:22px 0}
.result-row{padding:16px 0;border-bottom:1px solid #d7dce1}
.result-row:last-child{border:0}
@media(max-width:560px){.grid{grid-template-columns:1fr}.row.actions{align-items:stretch}.row.actions .btn{flex:1}.main{padding-top:24px}.brand{font-size:19px}}
</style></head><body><header class="bar"><div class="wrap"><a class="brand" href="./">ボートマッチ <small>政策比較</small></a></div></header><main class="wrap main"><div class="eyebrow">STEP 3 / RESULTS</div><h1 class="title">あなたの回答結果</h1><p class="lead">回答内容を一覧で確認できます。質問ごとの回答を見直すこともできます。</p><div class="card"><div class="row"><div><div class="muted">回答した選挙区</div><strong id="district"></strong></div><div style="text-align:right"><div class="muted">回答数</div><strong id="answered" style="font-size:25px"></strong></div></div><hr class="divider"><div id="answers"></div></div>
<div class="card" style="margin-top:18px"><h2 style="font-size:20px;margin-top:0">政党・候補者との一致度</h2><p>一致度は、各政党・候補者が同じ設問に回答した公式アンケート等のデータと照合して算出します。</p><div class="notice" style="background:#fff8e9;border-left:3px solid #d59b31;padding:12px">現在、照合に使う公式回答データの検証を進めています。未確認の立場を推測して一致率を表示することはしません。データが確認できた政党・候補者から順次公開します。</div></div>
<div class="row actions" style="margin-top:20px"><a class="btn light" href="answer.html?resume=1">回答を見直す</a><a class="btn" href="./">トップページへ</a></div></main><footer class="foot"><div class="wrap">回答はこの端末内に保存されています。<a href="./">VOTE MAP</a></div></footer>
<script>
const qs=[{"theme":"解散の是非","q":"今回の衆議院解散・総選挙について、最も近い考えは？","a":["解散は妥当だった","解散には疑問がある","どちらともいえない"]},{"theme":"経済","q":"物価高への対策として、最も優先すべきものは？","a":["消費税などの減税","給付金など家計への直接支援","賃上げ・投資の促進","財政健全化"]},{"theme":"経済","q":"消費税のあり方について、近い考えは？","a":["税率を引き下げる・廃止する","食料品など一部を軽減する","現行水準を維持する","社会保障財源として引き上げも検討する"]},{"theme":"経済","q":"最低賃金や賃上げを進める方法として、重視するものは？","a":["政府が目標を定めて引き上げを促す","中小企業への支援を拡充する","規制より企業の成長・生産性向上を重視する","地域や業種の実情に応じて進める"]},{"theme":"外交・安全保障","q":"日本の防衛力について、今後どうするべきだと思いますか？","a":["さらに強化する","必要な範囲で段階的に強化する","現状を基本的に維持する","防衛費を抑え外交を重視する"]},{"theme":"外交・安全保障","q":"防衛費の財源について、近い考えは？","a":["増税も含め安定財源を確保する","歳出の見直しで財源を捻出する","国債の活用も検討する","防衛費の増額自体を見直す"]},{"theme":"外交・安全保障","q":"日米安全保障体制について、どう考えますか？","a":["日米同盟をさらに強化する","同盟を維持しつつ日本の自主性も高める","近隣諸国との対話・協力を優先する","安全保障政策全体を見直す"]},{"theme":"外交・安全保障","q":"武器輸出のルールについて、近い考えは？","a":["輸出できる範囲を広げる","一定の条件のもとで認める","原則として制限を維持する","さらに厳しく制限する"]},{"theme":"外交・安全保障","q":"外国人政策で、政府が重視すべきことは？","a":["受け入れ拡大と共生支援","人手不足分野など必要な範囲で受け入れる","受け入れの条件・管理を厳格化する","受け入れ規模を縮小する"]},{"theme":"政治改革","q":"企業・団体献金について、近い考えは？","a":["禁止する","上限や公開ルールを厳格化して維持する","現行制度を基本的に維持する","政治活動の自由を優先し規制を増やさない"]},{"theme":"政治改革","q":"政治資金の透明性を高めるため、最も必要なことは？","a":["第三者機関による監視を強化する","収支報告の公開を迅速・詳細にする","罰則を強化する","現行制度の運用改善を優先する"]},{"theme":"暮らし","q":"社会保障の給付と負担について、近い考えは？","a":["給付水準を維持・拡充する","給付内容を見直し負担増を抑える","現役世代の負担軽減を優先する","制度全体を抜本的に見直す"]},{"theme":"暮らし","q":"年金制度について、最も重視することは？","a":["給付水準の維持","保険料負担の抑制","最低保障の強化","働き方に応じた制度の柔軟化"]},{"theme":"暮らし","q":"医療・介護の提供体制について、近い考えは？","a":["公的サービスを拡充する","地域の実情に合わせて効率化する","民間サービスの活用を広げる","利用者負担を含め制度を見直す"]},{"theme":"暮らし","q":"子育て世帯への支援で、優先すべきものは？","a":["児童手当など経済的支援","保育・学童など受け皿の整備","育休・柔軟な働き方の推進","教育費の負担軽減"]},{"theme":"暮らし","q":"高校・大学などの教育費負担について、どう考えますか？","a":["所得制限なしで無償化を広げる","所得に応じて支援を拡充する","必要性の高い家庭・分野に重点化する","公的支援より教育の質を重視する"]},{"theme":"暮らし","q":"地方と都市の格差を縮めるため、重視する政策は？","a":["地方への財源移転を増やす","地方の産業・雇用を育てる","交通・医療・教育など生活基盤を整える","規制緩和や民間投資を促す"]},{"theme":"暮らし","q":"原子力発電の今後について、近い考えは？","a":["安全性を確認した原発を活用する","新増設も含めて活用する","依存度を段階的に下げる","早期に廃止する"]},{"theme":"暮らし","q":"選択的夫婦別姓制度について、近い考えは？","a":["導入するべき","旧姓の通称使用を拡大するべき","現行制度を維持するべき","さらに議論が必要"]},{"theme":"憲法・皇室","q":"憲法改正について、近い考えは？","a":["必要な項目を具体的に改正する","議論を進め内容を見極めて判断する","現行憲法を維持する","改正より現行憲法の運用を重視する"]},{"theme":"憲法・皇室","q":"憲法9条について、どう考えますか？","a":["自衛隊の位置づけを明記する","自衛隊の活動範囲を含め改正を検討する","現行の条文を維持する","安全保障政策と合わせて慎重に議論する"]},{"theme":"憲法・皇室","q":"皇位継承のあり方について、近い考えは？","a":["女性天皇・女系天皇を認める方向で検討する","女性天皇は認めるが女系天皇は慎重に考える","男系による継承を維持する","幅広い議論を続ける"]}];const key="votemap2026";const s=JSON.parse(localStorage.getItem(key)||"null");const $=id=>document.getElementById(id);if(!s||!s.active?.length){$("answers").textContent="回答データがありません。トップページから回答を始めてください。";$("district").textContent="未選択";$("answered").textContent="0問"}else{$("district").textContent=s.district||"未指定";const total=s.active.length,done=s.active.filter(i=>s.answers[i]!==undefined).length;$("answered").textContent=done+" / "+total+"問";s.active.forEach((n,j)=>{const q=qs[n],v=s.answers[n];const choices=q.a.concat(["どちらともいえない","回答しない"]);const d=document.createElement("div");d.className="result-row";const top=document.createElement("span");top.className="topic";top.textContent=q.theme;const title=document.createElement("p");title.innerHTML="<strong>"+(j+1)+". "+q.q+"</strong>";const val=document.createElement("p");val.className="muted";val.textContent=v===undefined?"未回答":choices[v];d.append(top,title,val);$("answers").append(d)})}
</script></body></html>
